name: Net probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - name: Resolve and connect
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          getent ahosts api.openai.com || true
          echo "--- curl -4"; curl -4 -s -o /dev/null -w '%{http_code}\n' --max-time 15 https://api.openai.com/v1/models -H "Authorization: Bearer $OPENAI_API_KEY" || echo "curl4 failed $?"
          echo "--- curl -6"; curl -6 -s -o /dev/null -w '%{http_code}\n' --max-time 15 https://api.openai.com/v1/models -H "Authorization: Bearer $OPENAI_API_KEY" || echo "curl6 failed $?"
          echo "--- python httpx"
          uv run --with httpx python -c "
import httpx, os, traceback
try:
    r = httpx.get('https://api.openai.com/v1/models', headers={'Authorization':'Bearer '+os.environ['OPENAI_API_KEY']}, timeout=15)
    print('httpx status', r.status_code)
except Exception:
    traceback.print_exc()
"
